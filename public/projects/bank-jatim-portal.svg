      <rect x="726" y="92" width="244" height="110" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#d9ad5f" stroke-opacity=".25"/><rect x="750" y="118" width="80" height="10" rx="5" fill="#f1e4c3" fill-opacity=".4"/><rect x="750" y="146" width="140" height="28" rx="8" fill="#2f548f"/>
