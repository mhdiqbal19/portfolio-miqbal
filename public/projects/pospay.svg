<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1708"/><stop offset="1" stop-color="#070d1c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1e4c3"/><stop offset="1" stop-color="#c9973f"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".5" r=".6"><stop offset="0" stop-color="#d9ad5f" stop-opacity=".3"/><stop offset="1" stop-color="#d9ad5f" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#glow)"/>
  <!-- decorative rings -->
  <g fill="none" stroke="#d9ad5f" stroke-opacity=".18" stroke-width="2"><circle cx="300" cy="400" r="220"/><circle cx="300" cy="400" r="300"/><circle cx="300" cy="400" r="380"/></g>
  <!-- phone -->
  <g transform="translate(700 70)">
    <rect width="340" height="660" rx="52" fill="#0b1426" stroke="#d9ad5f" stroke-opacity=".5" stroke-width="3"/>
    <rect x="130" y="16" width="80" height="18" rx="9" fill="#000" fill-opacity=".6"/>
    <rect x="24" y="60" width="292" height="150" rx="26" fill="url(#gold)"/>
    <rect x="46" y="86" width="90" height="12" rx="6" fill="#1a1306" fill-opacity=".5"/>
    <rect x="46" y="126" width="190" height="30" rx="8" fill="#1a1306" fill-opacity=".75"/>
    <circle cx="274" cy="100" r="18" fill="#1a1306" fill-opacity=".25"/>
    <!-- service tiles -->
    <g fill="#ffffff" fill-opacity=".08" stroke="#d9ad5f" stroke-opacity=".3">
      <rect x="24" y="236" width="88" height="88" rx="22"/><rect x="126" y="236" width="88" height="88" rx="22"/><rect x="228" y="236" width="88" height="88" rx="22"/>
      <rect x="24" y="338" width="88" height="88" rx="22"/><rect x="126" y="338" width="88" height="88" rx="22"/><rect x="228" y="338" width="88" height="88" rx="22"/>
    </g>
    <g fill="#d9ad5f"><circle cx="68" cy="280" r="16"/><rect x="152" y="264" width="36" height="32" rx="8"/><path d="M272 262l16 30h-32z"/><rect x="50" y="364" width="36" height="32" rx="8" fill-opacity=".6"/><circle cx="170" cy="382" r="16" fill-opacity=".6"/><rect x="254" y="364" width="36" height="32" rx="16" fill-opacity=".6"/></g>
    <!-- list -->
    <g fill="#f1e4c3" fill-opacity=".14"><rect x="24" y="452" width="292" height="52" rx="16"/><rect x="24" y="516" width="292" height="52" rx="16"/></g>
    <rect x="24" y="592" width="292" height="44" rx="22" fill="#0b1426" stroke="#d9ad5f" stroke-opacity=".3"/>
  </g>
  <!-- floating chip -->
  <g transform="translate(560 520) rotate(-6)"><rect width="230" height="96" rx="24" fill="#f1e4c3"/><circle cx="48" cy="48" r="20" fill="#c9973f"/><rect x="82" y="30" width="110" height="12" rx="6" fill="#1b3a63" fill-opacity=".6"/><rect x="82" y="54" width="70" height="12" rx="6" fill="#1b3a63" fill-opacity=".3"/></g>
  <text x="90" y="660" font-size="64" font-weight="700" fill="#f1e4c3" fill-opacity=".9">Superapp</text>
  <rect x="90" y="684" width="120" height="4" rx="2" fill="#d9ad5f"/>
</svg>
