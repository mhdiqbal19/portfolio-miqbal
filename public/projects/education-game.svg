<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b3a63"/><stop offset="1" stop-color="#070d1c"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1e4c3"/><stop offset="1" stop-color="#c9973f"/></linearGradient>
    <radialGradient id="glow" cx=".75" cy=".25" r=".6"><stop offset="0" stop-color="#d9ad5f" stop-opacity=".35"/><stop offset="1" stop-color="#d9ad5f" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <!-- learning path -->
  <path d="M120 640 C 300 560, 380 700, 560 600 S 860 480, 1060 300" fill="none" stroke="#d9ad5f" stroke-opacity=".35" stroke-width="6" stroke-dasharray="4 18" stroke-linecap="round"/>
  <g>
    <circle cx="160" cy="628" r="34" fill="url(#gold)"/><text x="160" y="640" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1306">1</text>
    <circle cx="430" cy="652" r="34" fill="url(#gold)"/><text x="430" y="664" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1306">2</text>
    <circle cx="700" cy="560" r="34" fill="url(#gold)"/><text x="700" y="572" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1306">3</text>
    <circle cx="930" cy="420" r="34" fill="#ffffff" fill-opacity=".12" stroke="#d9ad5f" stroke-opacity=".6" stroke-width="3"/><text x="930" y="432" text-anchor="middle" font-size="34" font-weight="700" fill="#f1e4c3">4</text>
    <circle cx="1060" cy="300" r="34" fill="#ffffff" fill-opacity=".12" stroke="#d9ad5f" stroke-opacity=".6" stroke-width="3"/><text x="1060" y="312" text-anchor="middle" font-size="34" font-weight="700" fill="#f1e4c3">★</text>
  </g>
  <!-- letter blocks -->
  <g transform="translate(150 150)">
    <g transform="rotate(-8 90 90)"><rect width="190" height="190" rx="28" fill="#f1e4c3"/><rect x="10" y="10" width="170" height="170" rx="20" fill="none" stroke="#c9973f" stroke-width="3"/><text x="95" y="132" text-anchor="middle" font-size="120" font-weight="700" fill="#1b3a63">A</text></g>
    <g transform="translate(230 30) rotate(6 90 90)"><rect width="190" height="190" rx="28" fill="url(#gold)"/><text x="95" y="132" text-anchor="middle" font-size="120" font-weight="700" fill="#1a1306">B</text></g>
    <g transform="translate(470 -10) rotate(-4 90 90)"><rect width="190" height="190" rx="28" fill="#2f548f"/><rect x="10" y="10" width="170" height="170" rx="20" fill="none" stroke="#f1e4c3" stroke-opacity=".5" stroke-width="3"/><text x="95" y="132" text-anchor="middle" font-size="120" font-weight="700" fill="#f1e4c3">C</text></g>
  </g>
  <!-- progress + score -->
  <rect x="780" y="130" width="300" height="22" rx="11" fill="#ffffff" fill-opacity=".12"/>
  <rect x="780" y="130" width="190" height="22" rx="11" fill="url(#gold)"/>
  <g fill="#d9ad5f"><path d="M800 190l10 20 22 3-16 15 4 22-20-11-20 11 4-22-16-15 22-3z" transform="translate(0 -4)"/><path d="M880 190l10 20 22 3-16 15 4 22-20-11-20 11 4-22-16-15 22-3z" transform="translate(0 -4)"/><path d="M960 190l10 20 22 3-16 15 4 22-20-11-20 11 4-22-16-15 22-3z" fill-opacity=".3" transform="translate(0 -4)"/></g>
</svg>
